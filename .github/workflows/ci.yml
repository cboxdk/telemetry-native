name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.os }} · php ${{ matrix.php }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    # macOS is a development platform for this extension, and it has a known,
    # unexplained ~1-in-8 suite flake there (see KNOWN-ISSUES.md). Its results
    # are still worth seeing, so the job runs and reports — it just does not
    # gate the build while that is open. Linux and musl do gate.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}

    strategy:
      fail-fast: false
      matrix:
        # Linux is the production target, on both architectures.
        # macOS is build-and-test only: it runs the fallback timer backend.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl so the fork-safety test runs rather than skipping.
          extensions: pdo_sqlite, curl, opcache, pcntl
          coverage: none
          tools: none

      - name: Build
        run: |
          phpize
          ./configure --enable-cbox-telemetry
          make -j4

      - name: Report what was built
        run: |
          php -d extension=modules/cbox_telemetry.so -r '
            $s = cbox_telemetry_status();
            printf("php %s | backend=%s cpu-time=%s signal=%d hooks=%s crash=%s%s",
              PHP_VERSION, $s["timer_backend"], var_export($s["timer_cpu_time"], true),
              $s["timer_signal"], $s["hooks"], $s["crash_recorder"], PHP_EOL);
          '

      - name: Test
        run: NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests

      - name: Show failure diffs
        if: failure()
        run: for f in tests/*.diff; do echo "=== $f"; cat "$f"; done

  musl:
    name: "alpine musl · php ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: php:${{ matrix.php }}-cli-alpine

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          apk add --no-cache autoconf gcc g++ make libc-dev linux-headers
          phpize
          ./configure --enable-cbox-telemetry
          make -j4
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test TESTS=tests

  fpm:
    name: "php-fpm privilege separation · php ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: php:${{ matrix.php }}-fpm

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      # The crash recorder's lifecycle only breaks where the master runs as
      # root and the workers do not, which no unit test can reproduce.
      - name: Crash recorder under a real FPM master and non-root pool
        run: sh tests/fpm/run.sh

  memory:
    name: "valgrind"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
          tools: none

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build with frame pointers
        run: |
          phpize
          CFLAGS="-g -O1 -fno-omit-frame-pointer" ./configure --enable-cbox-telemetry
          make -j4

      # USE_ZEND_ALLOC=0 puts PHP on malloc so valgrind can see our allocations
      # instead of one opaque arena.
      - name: Memcheck
        env:
          USE_ZEND_ALLOC: 0
        run: |
          valgrind --error-exitcode=99 --leak-check=no --track-origins=yes \
            php -n -d extension=modules/cbox_telemetry.so \
                -d cbox_telemetry.profiler.period_us=500 \
                -d cbox_telemetry.crash.dir=/tmp/cbox-telemetry-vg \
                benchmarks/profile_accuracy.php
