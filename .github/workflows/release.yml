name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build assets for (dry run; nothing is published)'
        required: true

permissions:
  contents: write

jobs:
  # One native build per target. PIE picks an asset by an exact filename, so the
  # matrix here is the matrix of names it will look for — miss one and those
  # users silently fall back to compiling from source.
  binaries:
    name: "${{ matrix.php }} · ${{ matrix.target.arch }} · ${{ matrix.target.libc }}"
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # A second real axis, not `include:` — include entries that share no key
        # with the base matrix are merged into every combination in turn, so the
        # last one silently wins and twelve jobs collapse into three.
        target:
          - { arch: x86_64, libc: glibc, runner: ubuntu-24.04,     image_suffix: cli }
          - { arch: arm64,  libc: glibc, runner: ubuntu-24.04-arm, image_suffix: cli }
          - { arch: x86_64, libc: musl,  runner: ubuntu-24.04,     image_suffix: cli-alpine }
          - { arch: arm64,  libc: musl,  runner: ubuntu-24.04-arm, image_suffix: cli-alpine }

    steps:
      - uses: actions/checkout@v4

      # Deliberately not `container:`. GitHub cannot run JavaScript actions
      # inside an Alpine container on arm64 runners ("only supported on x64
      # Linux runners"), so checkout fails before the build starts. Driving the
      # image with docker run keeps all twelve targets identical instead of
      # special-casing three of them.
      - name: Build and package
        env:
          IMAGE: php:${{ matrix.php }}-${{ matrix.target.image_suffix }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PHP_SERIES: ${{ matrix.php }}
          ARCH: ${{ matrix.target.arch }}
          LIBC: ${{ matrix.target.libc }}
        run: |
          set -eux
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src" \
            -e TAG -e PHP_SERIES -e ARCH -e LIBC \
            -w /src "$IMAGE" sh -eux -c '
              if [ -f /etc/alpine-release ]; then
                apk add --no-cache autoconf gcc g++ make libc-dev linux-headers binutils tar
              else
                apt-get update -qq
                apt-get install -y -qq $PHPIZE_DEPS
              fi

              phpize
              ./configure --enable-cbox-telemetry
              make -j"$(nproc)"
              test -f modules/cbox_telemetry.so

              # Refuse to ship something that does not load, or a ZTS build.
              php -d extension="$PWD/modules/cbox_telemetry.so" -r "
                \$s = cbox_telemetry_status();
                if (\$s[\"thread_safe\"]) { fwrite(STDERR, \"unexpected ZTS build\n\"); exit(1); }
                printf(\"%s on php %s, timer=%s%s\", cbox_telemetry_version(), PHP_VERSION, \$s[\"timer_backend\"], PHP_EOL);
              "

              strip --strip-unneeded modules/cbox_telemetry.so

              rm -rf staging && mkdir -p staging dist
              # PIE expects <extension-name>.so at the root of the archive.
              cp modules/cbox_telemetry.so staging/cbox_telemetry.so

              # php_{name}-{version}_php{maj.min}-{arch}-{os}-{libc}-nts.tgz,
              # lowercased. Verified against php/pie PrePackagedBinaryAssetName.
              base=$(echo "php_cbox_telemetry-${TAG}_php${PHP_SERIES}-${ARCH}-linux-${LIBC}-nts" | tr "[:upper:]" "[:lower:]")
              tar -czf "dist/${base}.tgz" -C staging cbox_telemetry.so

              # Composer keeps a tag,s leading "v" in the pretty version, so that
              # is what PIE asks for. Publish the bare spelling too, as cheap
              # insurance against a release cut without the prefix.
              case "$TAG" in
                v*) bare=$(echo "php_cbox_telemetry-${TAG#v}_php${PHP_SERIES}-${ARCH}-linux-${LIBC}-nts" | tr "[:upper:]" "[:lower:]")
                    cp "dist/${base}.tgz" "dist/${bare}.tgz" ;;
              esac

              ls -l dist/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.php }}-${{ matrix.target.arch }}-${{ matrix.target.libc }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    name: publish release
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Select this version's section, not the range from [Unreleased] to the
          # next heading — which at release time is empty and yields a body of
          # two headings and nothing else.
          # Create-or-upload rather than create. Drafting a release in the
          # GitHub UI creates the tag first, which triggers this workflow and
          # would otherwise die on "already_exists", leaving a release with no
          # assets. The same applies to re-running this job.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
              artifacts/*.tgz artifacts/SHA256SUMS
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes-file <(awk -v v="${TAG#v}" '/^## \[/{p = index($0,"["v"]")>0; if (p) next} p' CHANGELOG.md) \
              artifacts/*.tgz artifacts/SHA256SUMS
          fi
