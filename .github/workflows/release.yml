name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build assets for (dry run; nothing is published)'
        required: true

permissions:
  contents: write

jobs:
  # One native build per target. PIE picks an asset by an exact filename, so the
  # matrix here is the matrix of names it will look for — miss one and those
  # users silently fall back to compiling from source.
  binaries:
    name: "${{ matrix.php }} · ${{ matrix.target.arch }} · ${{ matrix.target.libc }}"
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    container: php:${{ matrix.php }}-${{ matrix.target.image_suffix }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # A second real axis, not `include:` — include entries that share no key
        # with the base matrix are merged into every combination in turn, so the
        # last one silently wins and twelve jobs collapse into three.
        target:
          - { arch: x86_64, libc: glibc, runner: ubuntu-24.04,     image_suffix: cli }
          - { arch: arm64,  libc: glibc, runner: ubuntu-24.04-arm, image_suffix: cli }
          - { arch: x86_64, libc: musl,  runner: ubuntu-24.04,     image_suffix: cli-alpine }
          - { arch: arm64,  libc: musl,  runner: ubuntu-24.04-arm, image_suffix: cli-alpine }

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache autoconf gcc g++ make libc-dev linux-headers tar
          else
            apt-get update -qq
            apt-get install -y -qq $PHPIZE_DEPS
          fi

      - name: Build
        run: |
          phpize
          ./configure --enable-cbox-telemetry
          make -j"$(nproc)"
          test -f modules/cbox_telemetry.so

      - name: Verify it loads and reports the right build
        run: |
          php -d extension="$PWD/modules/cbox_telemetry.so" -r '
            $s = cbox_telemetry_status();
            if ($s["thread_safe"]) { fwrite(STDERR, "unexpected ZTS build\n"); exit(1); }
            printf("%s on php %s, timer=%s%s", cbox_telemetry_version(), PHP_VERSION, $s["timer_backend"], PHP_EOL);
          '

      - name: Package for PIE
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          strip --strip-unneeded modules/cbox_telemetry.so || true

          mkdir -p dist staging
          # PIE expects <extension-name>.so at the root of the archive.
          cp modules/cbox_telemetry.so staging/cbox_telemetry.so

          # php_{name}-{version}_php{maj.min}-{arch}-{os}-{libc}-nts.tgz, lowercased.
          # Verified against php/pie's PrePackagedBinaryAssetName.
          base="php_cbox_telemetry-${TAG}_php${{ matrix.php }}-${{ matrix.target.arch }}-linux-${{ matrix.target.libc }}-nts"
          base=$(echo "$base" | tr '[:upper:]' '[:lower:]')
          tar -czf "dist/${base}.tgz" -C staging cbox_telemetry.so

          # Composer's pretty version keeps a tag's leading "v", so that is the
          # name PIE asks for. Publish the bare-version spelling too, in case a
          # release is ever cut without the prefix — it costs one copy.
          if [ "${TAG#v}" != "$TAG" ]; then
            bare=$(echo "php_cbox_telemetry-${TAG#v}_php${{ matrix.php }}-${{ matrix.target.arch }}-linux-${{ matrix.target.libc }}-nts" | tr '[:upper:]' '[:lower:]')
            cp "dist/${base}.tgz" "dist/${bare}.tgz"
          fi

          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.php }}-${{ matrix.target.arch }}-${{ matrix.target.libc }}
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    name: publish release
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file <(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | head -100) \
            artifacts/*.tgz artifacts/SHA256SUMS
